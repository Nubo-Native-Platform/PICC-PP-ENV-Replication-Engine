# ==============================================================================
# PICC-PP-ENV-Replication-Engine - Application Configuration
# ==============================================================================

# Server Configuration
server.port=${SERVER_PORT:8082}
spring.application.name=envrep-engine

# Active Profile (Override via SPRING_PROFILES_ACTIVE=dev | main | local)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:main}

# Spring Cloud Config Label
spring.cloud.config.label=${CONFIG_LABEL:v1}

# Optional Centralized Spring Cloud Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}/nnp-config

# ------------------------------------------------------------------------------
# GitOps Repository Configuration
# ------------------------------------------------------------------------------
gitops.folder=${GITOPS_FOLDER:./gitops}
gitops.gitlabUrl=${GITOPS_GITLAB_URL:https://gitlab.example.com}
gitops.repopath=${GITOPS_REPOPATH:/env-replication-gitops/${env}-synch.git}
gitops.template=${GITOPS_TEMPLATE:./template}

# Git Repository Credentials
gitlab.repo.user=${GITLAB_REPO_USER:gitops-bot}
gitlab.repo.password=${GITLAB_REPO_PASSWORD:}
gitlab.nnp.user=${GITLAB_NNP_USER:nnp-support}

# ------------------------------------------------------------------------------
# PostgreSQL Datasource Configuration
# ------------------------------------------------------------------------------
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/eiimp-platform}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.properties.hibernate.show_sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ------------------------------------------------------------------------------
# Apache ActiveMQ Artemis Message Broker Configuration
# ------------------------------------------------------------------------------
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:artemis}
spring.activemq.password=${ACTIVEMQ_PASSWORD:artemis}

# ------------------------------------------------------------------------------
# Outbound Microservices Integration (WebClient)
# ------------------------------------------------------------------------------
redmine.service.baseurl=${REDMINE_SERVICE_BASEURL:http://localhost:8095/redmineint}
gitint.service.baseurl=${GITINT_SERVICE_BASEURL:http://localhost:8094/gitlabint}
mail.service.baseurl=${MAIL_SERVICE_BASEURL:http://localhost:8080}
haproxy.service.baseurl=${HAPROXY_SERVICE_BASEURL:http://localhost:8081}

# ------------------------------------------------------------------------------
# Redmine Support Ticketing Integration
# ------------------------------------------------------------------------------
redmine.apiKey=${REDMINE_API_KEY:}
redmine.project.name=${REDMINE_PROJECT_NAME:EIIMP Environment Support}

# ------------------------------------------------------------------------------
# ArgoCD Feign Client Integration
# ------------------------------------------------------------------------------
argo.user=${ARGO_USER:admin}
argo.pass=${ARGO_PASSWORD:}
feign.name=${FEIGN_NAME:argo-client}
feign.url=${FEIGN_URL:http://localhost:8080}
feign.url.api=${FEIGN_URL_API:/api/v1}

# ------------------------------------------------------------------------------
# Container Image Registries
# ------------------------------------------------------------------------------
gitlcnc.imageregistry.url=${GITLCNC_REGISTRY_URL:https://registry.example.com}
gitlab.nnp.imageregistry.url=${GITLAB_NNP_REGISTRY_URL:https://registry.example.com}

# ------------------------------------------------------------------------------
# Kubernetes & Routing Platform Configuration
# ------------------------------------------------------------------------------
k8s.cluster.node.afinity.label=${K8S_NODE_AFFINITY_LABEL:default-node-group}
haproxy.base.domain=${HAPROXY_BASE_DOMAIN:nnp.nubons.com}

# ------------------------------------------------------------------------------
# Swagger / OpenAPI Documentation
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=true

# ------------------------------------------------------------------------------
# Actuator & Observability
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.env.show-values=NEVER
management.endpoint.configprops.show-values=NEVER

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.nnp.envrep=${LOG_LEVEL:INFO}
logging.level.feign=${FEIGN_LOG_LEVEL:WARN}